# Fork CI uses GitHub-hosted runners. The original large-runner workflow is
# preserved in .github/upstream-workflows/ci.yml for future upstream integration.
name: 10derCraft CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 10dercraft-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "2"
      SOLIDCRAFT_TEST_JOBS: "2"
      SOLIDCRAFT_TEST_RUNNER: nextest
      NEXTEST_TEST_THREADS: "2"
      SOLIDCRAFT_GPU: software
      SOLIDCRAFT_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest
      - name: Native build and software GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev mesa-vulkan-drivers libvulkan1
      - name: Full repository gates and tests
        run: cargo xtask ci
